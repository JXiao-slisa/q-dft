name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src/slisadft
      - name: Run tests (mock engine mode)
        env:
          SLISADFT_ENGINE_MODE: mock
          LLM_API_KEY: test-key
        run: pytest -v
      - name: Guard — no secrets committed
        run: |
          ! grep -rE "sk-[A-Za-z0-9]{16,}" --include="*.py" --include="*.yaml" src/ tests/
          test ! -f .env && echo "OK: no .env in repo"
